openapi: 3.0.3
info:
  title: Contrat d'API — KFOKAM48 Présence & Relecture
  version: "1.0"
  description: |
    Contrat complété à l'étape 1 de l'épreuve finale KFOKAM48.
    
    Les 5 opérations imposées par le sujet sont conservées EXACTEMENT
    (mêmes chemins, verbes, codes de statut, format d'erreur).
    
    Les opérations supplémentaires sont ajoutées sous /api pour couvrir
    les exigences fonctionnelles EF2, EF4, EF6, EF10 et les besoins
    du frontend.

servers:
  - url: http://localhost:8080

paths:

  # ============================================================
  # OPÉRATIONS IMPOSÉES PAR LE SUJET (5)
  # ============================================================

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      tags: [Présences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      tags: [Exercices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE

  /api/lectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      tags: [Relectures]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      tags: [Tableau]
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true, description: "Moyenne des notes finales des 2 relectures" }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ============================================================
  # OPÉRATIONS AJOUTÉES (EF2, EF4, EF6, EF10, frontend)
  # ============================================================

  /api/sessions/{id}/cloture:
    post:
      summary: Le formateur clôture une session (EF2)
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  clotureAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/presences/manuelle:
    post:
      summary: Le formateur ajoute une présence manuellement (EF4, Q14)
      tags: [Présences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée avec source FORMATEUR
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT

  /api/exercices/{id}/lien:
    patch:
      summary: L'étudiant remplace le lien de son exercice (EF6, Q13)
      tags: [Exercices]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  lien: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_COMMENCEE

  /api/exercices/{id}:
    get:
      summary: Consulter un exercice et sa relecture (EF10, Q8)
      tags: [Exercices]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: |
            Détail de l'exercice. Si une relecture est rendue, la note et le
            commentaire sont présents. Le nom du relecteur n'est JAMAIS exposé (Q8).
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, lien, statut]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  lien: { type: string }
                  statut: { type: string }
                  note: { type: integer, nullable: true, minimum: 0, maximum: 20 }
                  commentaire: { type: string, nullable: true }
                  noteProvisoire: { type: boolean }
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU

  /api/sessions:
    get:
      summary: Lister les sessions d'une promotion (frontend)
      tags: [Sessions]
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    titre: { type: string }
                    code: { type: string }
                    ouvertureAt: { type: string, format: date-time }
                    expirationAt: { type: string, format: date-time }
                    clotureAt: { type: string, format: date-time, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/etudiants:
    get:
      summary: Lister les étudiants d'une promotion (frontend)
      tags: [Étudiants]
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
                    prenom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/lectures/en-attente:
    get:
      summary: Lister les relectures en attente pour un étudiant (frontend)
      tags: [Relectures]
      parameters:
        - name: etudiantId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures assignées et non encore rendues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    relectureId: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    lien: { type: string }
                    statut: { type: string }
                    assigneeAt: { type: string, format: date-time }

# ============================================================
# COMPOSANTS RÉUTILISABLES
# ============================================================

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple — CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.